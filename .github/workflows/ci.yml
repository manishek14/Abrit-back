name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend — build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --ci

  backend-e2e:
    name: Backend — e2e on PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: abrit
          POSTGRES_PASSWORD: abrit
          POSTGRES_DB: abrit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abrit -d abrit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      E2E_DATABASE_URL: postgres://abrit:abrit@127.0.0.1:5432/abrit_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: E2E tests (migrations run automatically on boot)
        run: npm run test:e2e
