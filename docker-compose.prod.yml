# ============================================================================
# AbrIT — PRODUCTION deployment (review round 6, P1 deployment infrastructure)
#
#   cp .env.production.example .env.production   # fill in REAL secrets first!
#   docker build -t abrit-front:latest /path/to/Abrit-front   # panel from the split repo
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Repository split: this compose file lives in AbrIT-back (backend at repo
# root → `build: .`); the `frontend` service consumes the `abrit-front:latest`
# image built from the separate Abrit-front repository.
#
# Topology (all on one host, one backend instance — see docs/DEPLOYMENT.md):
#
#   browser ── :80 ──▶ frontend (nginx)
#                       ├── static SPA build
#                       ├── /api/*       ──▶ backend:3000
#                       └── /socket.io/* ──▶ backend:3000 (WebSocket upgrade)
#                                             └──▶ db (postgres 16, internal)
#   db-backup (optional profile): nightly pg_dump with retention into ./backups
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: abrit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abrit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-abrit}
    volumes:
      - abrit_pgdata:/var/lib/postgresql/data
    # NOT published to the host: only backend and the backup sidecar reach it
    # over the internal network. (Expose temporarily for a host-side pg_dump.)
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-abrit} -d ${POSTGRES_DB:-abrit}']
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: .                # the backend Dockerfile is at the root of this repo
    container_name: abrit-backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      # inside the compose network the database host is the service name
      DATABASE_URL: postgres://${POSTGRES_USER:-abrit}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-abrit}
      NODE_ENV: production
      PORT: '3000'
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy
    # Single instance BY DESIGN (in-memory per-chat ordering queue) — never
    # scale this service beyond one replica. See docs/DEPLOYMENT.md.
    deploy:
      replicas: 1
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health/live >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  # The admin panel SPA is built from the separate Abrit-front repository:
  #   git clone https://github.com/manishek14/Abrit-front.git
  #   docker build -t abrit-front:latest Abrit-front
  frontend:
    image: abrit-front:latest
    container_name: abrit-frontend
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      backend:
        condition: service_healthy

  # Optional automated database backup: nightly dump into ./backups on the
  # host, KEEP_DAYS retention. Enable with:
  #   docker compose -f docker-compose.prod.yml --profile backup up -d
  db-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: abrit-db-backup
    restart: unless-stopped
    profiles: ['backup']
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-abrit}
      POSTGRES_USER: ${POSTGRES_USER:-abrit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: '@daily'
      # Backup retention policy (review round 6): keep 14 daily dumps
      # (override in .env.production if you need longer history).
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups

volumes:
  abrit_pgdata:
